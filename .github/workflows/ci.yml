name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 development dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev
      - name: Build and test
        run: |
          make freestanding-check
          make test
          make demo
          make desktop-build
