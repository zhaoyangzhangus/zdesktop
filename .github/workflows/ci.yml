name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build, SDL2, and TrueType test-font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev fonts-wqy-microhei
      - name: Build and test
        run: |
          make clean
          make freestanding-check
          make test-font
          make demo
          make desktop-build
